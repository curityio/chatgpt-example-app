_format_version: '2.1'
_transform: true

services:

#
# All MCP client API requests use this API gateway entry point
# The MCP server connection is secured by opaque access tokens
# The phantom token plugin returns a 401 that points the MCP client to resource metadata
# CORS allows access to the ChatGPT and MCP Inspector web clients
#
- name: mcp-server
  url: ${MCP_SERVER_INTERNAL_URL}
  routes:
  - name: mcp-server-route
    hosts:
    - $EXTERNAL_HOST_NAME
    paths:
    - /mcp
  plugins:
  - name: cors
    config:
      origins:
        - 'http://localhost:6274'
        - 'https://chatgpt.com'
      exposed_headers:
        - 'www-authenticate'
        - 'content-type'
        - 'authorization'
        - 'mcp-session-id'
        - 'mcp-protocol-version'
  - name: phantom-token
    config:
      introspection_endpoint: http://idsvr:8443/oauth/v2/oauth-introspect
      client_id: api-gateway-client
      client_secret: Password1
      token_cache_seconds: 900
      resource_metadata_url: $EXTERNAL_BASE_URL/.well-known/oauth-protected-resource
      scope: portfolio

#
# The MCP server exposes OAuth protected resource metadata that points MCP clients to the authorization server
# This endpoint is not secured so we use a different route for it
#
- name: mcp-server-resource-metadata
  url: $MCP_SERVER_INTERNAL_URL/.well-known/oauth-protected-resource
  routes:
  - name: mcp-server-resource-metadata-route
    hosts:
    - $EXTERNAL_HOST_NAME
    paths:
    - /.well-known/oauth-protected-resource
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'
      - 'https://chatgpt.com'

#
# MCP authorization requires a root level OAuth authorization server metadata endpoint
#
- name: authorization-server-metadata-reroute
  url: http://idsvr:8443/.well-known/oauth-authorization-server/oauth/v2/oauth-anonymous
  routes:
  - name: authorization-server-metadata-reroute
    hosts:
    - $EXTERNAL_HOST_NAME
    paths:
    - /.well-known/oauth-authorization-server
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'
      - 'https://chatgpt.com'

#
# All other authorization server endpoints
#
- name: authorization-server
  url: http://idsvr:8443
  routes:
  - name: oauth-route
    hosts:
    - $EXTERNAL_HOST_NAME
    paths:
    - /
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'
      - 'https://chatgpt.com'
