_format_version: '2.1'
_transform: true

services:

#
# All MCP client API requests use this API gateway entry point
# The MCP server connection is secured by opaque access tokens
# The phantom token plugin returns a 401 that points the MCP client to resource metadata
#
- name: mcp-server
  url: http://mcp-server:8081/
#  To use a local instance of the MCP server uncomment the following line and comment out the one oabove
#  url: http://host.docker.internal:8081/
  routes:
  - name: mcp-server-route
    hosts:
    - $BASE_MCP_DOMAIN
    paths:
    - /mcp
  plugins:
  - name: cors # This is required for the MCP inspector to work properly
    config:
      origins:
        - 'http://localhost:6274'
        - 'https://chatgpt.com'
      exposed_headers:
        - 'content-type'
        - 'authorization'
        - 'mcp-session-id'
        - 'mcp-protocol-version'
  - name: phantom-token
    config:
      introspection_endpoint: http://idsvr:8443/oauth/v2/oauth-introspect
      client_id: api-gateway-client
      client_secret: Password1
      token_cache_seconds: 900
      resource_metadata_url: https://$BASE_MCP_DOMAIN/.well-known/oauth-protected-resource
      scope: read

#
# The MCP server exposes OAuth protected resource metadata that points MCP clients to the authorization server
# This endpoint is not secured so we use a different route for it
#
- name: mcp-server-resource-metadata
  url: http://mcp-server:8081/.well-known/oauth-protected-resource
  #  To use a local instance of the MCP server uncomment the following line and comment out the one oabove
#  url: http://host.docker.internal:8081/.well-known/oauth-protected-resource
  routes:
  - name: mcp-server-resource-metadata-route
    hosts:
    - $BASE_MCP_DOMAIN
    paths:
    - /.well-known/oauth-protected-resource
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'
      - 'https://chatgpt.com'

#
# The main Portfolio API route serves other types of API clients
#
- name: portfolio-api
  url: http://portfolio-api:8080/
  routes:
  - name: portfolio-api-route
    hosts:
    - api.demo.example
    paths:
    - /
  plugins:
  - name: phantom-token
    config:
      introspection_endpoint: http://idsvr:8443/oauth/v2/oauth-introspect
      client_id: api-gateway-client
      client_secret: Password1
      token_cache_seconds: 900

#
# MCP authorization requires a root level OAuth authorization server metadata endpoint
# - https://github.com/modelcontextprotocol/typescript-sdk/issues/545
#
- name: authorization-server-metadata-reroute
  url: http://idsvr:8443/.well-known/oauth-authorization-server/oauth/v2/oauth-anonymous
  routes:
  - name: authorization-server-metadata-reroute
    hosts:
    - $BASE_IDSVR_DOMAIN
    paths:
    - /.well-known/oauth-authorization-server
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'

#
# The settings token_endpoint_auth_method=none and client_uri are incompatible with the Curity Identity Server
# Therefore, use Kong's request transformer plugin to update incoming requests
#
- name: authorization-server-registration
  url: http://idsvr:8443/oauth/v2/oauth-registration
  routes:
  - name: authorization-server-registration
    hosts:
    - $BASE_IDSVR_DOMAIN
    paths:
    - /oauth/v2/oauth-registration
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'
  - name: request-transformer
    enabled: yes
    config:
      remove:
        body:
        - token_endpoint_auth_method:none
        - client_uri
      add:
        body:
        - token_endpoint_auth_method:client_secret_basic

#
# All other authorization server endpoints
#
- name: authorization-server
  url: http://idsvr:8443
  routes:
  - name: oauth-route
    hosts:
    - $BASE_IDSVR_DOMAIN
    paths:
    - /
  plugins:
  - name: cors
    config:
      origins:
      - 'http://localhost:6274'

#
# The admin UI for the Curity Identity Server
#
- name: admin-ui
  url: http://idsvr:6749
  routes:
  - name: admin-ui-route
    hosts:
    - admin.demo.example
    paths:
    - /

#
# The email inbox for testing
#
- name: email-inbox
  url: http://smtpserver:1080
  routes:
  - name: email-inbox-route
    hosts:
    - mail.demo.example
    paths:
    - /
